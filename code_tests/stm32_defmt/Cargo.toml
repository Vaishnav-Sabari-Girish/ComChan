[package]
name = "stm32_defmt"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32l433rc", "unstable-pac", "memory-x", "time-driver-any", "exti", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
heapless = "0.9.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[workspace]

[profile.release]
opt-level = "z"
codegen-units = 1 
lto = false
strip = false
debug = 2
panic = "abort"
